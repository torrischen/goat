name: Bug report
description: Report a reproducible problem in goat
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include API keys, credentials, private conversation data, or unredacted logs.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample or repository that reproduces the problem.
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: goat version
      description: Release, pseudo-version, or commit hash.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: output of go version
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64, etc.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and personal or production data before pasting logs.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
        - label: This is not a security vulnerability. Security reports follow SECURITY.md.
          required: true
